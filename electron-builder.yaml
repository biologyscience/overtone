appId: org.js.overtone
productName: OverTone

win:
  artifactName: "${productName}-${version}-${os}.${ext}"
  icon: media/overtone-logo.ico
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  installerIcon: media/overtone-logo.ico
  uninstallerIcon: media/overtone-logo.ico

linux:
  artifactName: "${productName}-${version}-${os}.${ext}"
  icon: media/overtone-logo.png
  category: AudioVideo
  syncDesktopName: true
  target:
    - AppImage
    - zip

mac:
  artifactName: "${productName}-${version}-${os}.${ext}"
  icon: media/overtone-logo.icns
  target:
    - dmg
    - zip

dmg:
  title: OverTone
  icon: media/overtone-logo.icns

files:
  - "electron/**"
  - "!electron/appdata/**/*"
  - "electron/appdata/eqs.json"
  - "!guides/"
  - "!out/"
  - "!media/**/*"
  - "media/overtone-*"
  - "!react/**/*"
  - "react/dist"
  - "templates/**"
  - "!build.yml"
  - "!forge.config.js"
  - "LICENSE"
  - "README.md"